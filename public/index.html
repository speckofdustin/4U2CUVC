<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4U2CtheUVC — UVC Camera Control Panel</title>
  <style>
    :root {
      --bg: #0a0a0a;
      --surface: #141414;
      --surface2: #1e1e1e;
      --accent: #44bd32;
      --accent-dim: #2d7a1e;
      --text: #e4e4e4;
      --text-dim: #777777;
      --danger: #e74c3c;
      --border: #2a2a2a;
      --slider-track: #2a2a2a;
      --slider-fill: #44bd32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    .app {
      display: grid;
      grid-template-columns: 1fr 420px;
      grid-template-rows: auto 1fr;
      height: 100vh;
      gap: 0;
      overflow: hidden;
    }

    header {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .app-icon {
      width: 28px;
      height: 28px;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    header h1 span {
      color: var(--accent);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .device-name {
      font-size: 13px;
      color: var(--text-dim);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      display: inline-block;
    }

    .status-dot.offline { background: var(--danger); }

    .preview-section {
      display: flex;
      flex-direction: column;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .preview-container {
      position: relative;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
    }

    .preview-message {
      position: absolute;
      inset: 0;
      display: none;
      place-items: center;
      padding: 24px;
      color: var(--text-dim);
      font-size: 13px;
      text-align: center;
      pointer-events: none;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #000;
    }

    #false-color-overlay,
    #skin-tone-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      display: none;
    }

    .fc-legend {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 190px;
      display: none;
      flex-direction: column;
      z-index: 12;
      pointer-events: none;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(8,8,8,0.88);
      box-shadow: 0 4px 18px rgba(0,0,0,0.35);
    }

    .fc-legend.show {
      display: flex;
    }

    .fc-legend-stop {
      display: flex;
      align-items: center;
      min-height: 20px;
      position: relative;
    }

    .fc-legend-title {
      padding: 7px 8px;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      color: var(--text);
      border-bottom: 1px solid rgba(255,255,255,0.12);
    }

    .fc-legend-title span {
      display: block;
      margin-top: 3px;
      font-weight: 500;
      letter-spacing: 0;
      color: #ffcc66;
    }

    .fc-legend-color {
      width: 28px;
      align-self: stretch;
      flex: 0 0 28px;
    }

    .fc-legend-label {
      padding: 3px 6px;
      font-size: 9px;
      color: #fff;
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .fc-skin-badge {
      margin-left: 4px;
      font-size: 8px;
      color: #ffcc66;
      font-weight: 700;
      text-transform: uppercase;
    }

    .skin-tone-section {
      display: none;
      position: absolute;
      top: 50px;
      left: 8px;
      z-index: 13;
      width: 260px;
      max-height: calc(100% - 58px);
      overflow-y: auto;
      padding: 12px;
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 6px;
      background: rgba(14,14,14,0.9);
      box-shadow: 0 4px 18px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
    }

    .skin-tone-section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin: 0;
    }

    .skin-tone-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
    }

    .skin-reset-btn {
      padding: 3px 7px;
      border: 1px solid var(--border);
      border-radius: 3px;
      color: var(--text-dim);
      background: transparent;
      font-size: 10px;
      cursor: pointer;
    }

    .skin-reset-btn:hover {
      color: var(--text);
      border-color: var(--accent);
    }

    .skin-tone-section .control-row {
      margin-bottom: 10px;
    }

    .skin-tone-section .control-header {
      margin-bottom: 4px;
    }

    .preview-container.skin-active .fc-legend {
      left: 280px;
    }

    .preview-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      background: rgba(0,0,0,0.7);
      position: absolute;
      top: 8px;
      left: 8px;
      border-radius: 6px;
      z-index: 10;
    }

    .preview-toolbar .toolbar-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
    }

    .toolbar-select {
      font-size: 11px;
      padding: 3px 6px;
      background: #111;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 3px;
    }

    .fps-actual {
      min-width: 44px;
      font-size: 10px;
      color: var(--text-dim);
      font-variant-numeric: tabular-nums;
    }

    .toolbar-btn {
      font-size: 11px;
      padding: 3px 8px;
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .toolbar-btn:hover { border-color: var(--text-dim); color: var(--text); }
    .toolbar-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(68,189,50,0.1); }

    .scopes-row {
      display: flex;
      height: 220px;
      min-height: 220px;
      border-top: 1px solid var(--border);
      background: #000;
    }

    .scope-panel {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .scope-panel + .scope-panel {
      border-left: 1px solid var(--border);
    }

    .scope-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      padding: 6px 10px 0;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 2;
      background: rgba(0,0,0,0.5);
      border-radius: 0 0 4px 0;
    }

    .scope-canvas {
      width: 100%;
      height: 100%;
    }

    .controls-panel {
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .panel-section {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .panel-section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .control-row {
      margin-bottom: 14px;
    }

    .control-row:last-child { margin-bottom: 0; }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .control-label {
      font-size: 13px;
      font-weight: 500;
    }

    .control-value {
      font-size: 12px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      min-width: 48px;
      text-align: right;
    }

    .control-value-input {
      width: 78px;
      padding: 3px 5px;
      font: inherit;
      font-size: 12px;
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      text-align: right;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      outline: none;
    }

    .control-value-input:hover,
    .control-value-input:focus {
      border-color: var(--accent-dim);
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 6px;
      border-radius: 3px;
      background: var(--slider-track);
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: 2px solid var(--bg);
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    input[type="range"]:active::-webkit-slider-thumb {
      background: #5dd93b;
    }

    .exposure-slider-wrap {
      position: relative;
    }

    .control-help {
      margin-top: 5px;
      font-size: 10px;
      color: var(--text-dim);
    }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .toggle-row:last-child { margin-bottom: 0; }

    .toggle-label {
      font-size: 13px;
      font-weight: 500;
    }

    .toggle {
      position: relative;
      display: inline-block;
      flex: 0 0 44px;
      width: 44px;
      height: 24px;
      cursor: pointer;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-track {
      position: absolute;
      inset: 0;
      background: var(--slider-track);
      border-radius: 12px;
      transition: background 0.2s;
    }

    .toggle input:checked + .toggle-track {
      background: var(--accent);
    }

    .toggle-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
      pointer-events: none;
    }

    .toggle input:checked ~ .toggle-knob {
      transform: translateX(20px);
    }

    .select-control {
      width: 100%;
      padding: 6px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-size: 13px;
      cursor: pointer;
    }

    .pan-tilt-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .pan-tilt-grid .control-row { margin-bottom: 0; }

    .preset-section {
      padding: 16px 20px;
    }

    .preset-section h2 {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      margin-bottom: 14px;
    }

    .preset-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .preset-actions input {
      flex: 1;
      padding: 7px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 4px;
      font-size: 13px;
    }

    .preset-actions input::placeholder { color: var(--text-dim); }

    .btn {
      padding: 7px 14px;
      border: none;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      white-space: nowrap;
    }

    .btn:hover { opacity: 0.85; }
    .btn:active { opacity: 0.7; }

    .btn-primary {
      background: var(--accent);
      color: #111;
    }

    .btn-secondary {
      background: var(--surface2);
      color: var(--text);
    }

    .btn-danger {
      background: transparent;
      color: var(--danger);
      padding: 4px 8px;
      font-size: 12px;
    }

    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .preset-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      background: var(--bg);
      border-radius: 4px;
      border: 1px solid var(--border);
    }

    .preset-item-name {
      font-size: 13px;
      font-weight: 500;
    }

    .preset-item-date {
      font-size: 11px;
      color: var(--text-dim);
    }

    .preset-item-actions {
      display: flex;
      gap: 4px;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--surface2);
      color: var(--text);
      padding: 10px 20px;
      border-radius: 6px;
      font-size: 13px;
      border: 1px solid var(--accent);
      transition: transform 0.3s ease;
      z-index: 100;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .refresh-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 5px 10px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    .refresh-btn:hover { border-color: var(--accent); color: var(--text); }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: var(--text-dim);
    }

    @media (max-width: 900px) {
      .app {
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto 1fr;
      }
      .preview-section { min-height: 300px; }
      .scopes-row { height: 180px; min-height: 180px; }
      .controls-panel { border-left: none; border-top: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="header-left">
        <svg class="app-icon" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="28" height="28" rx="6" fill="#141414"/>
          <circle cx="14" cy="14" r="8.5" stroke="#44bd32" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="5" stroke="#44bd32" stroke-width="1" opacity="0.5"/>
          <circle cx="14" cy="14" r="1.8" fill="#44bd32"/>
          <circle cx="20" cy="8.5" r="1.2" fill="#44bd32" opacity="0.5"/>
          <line x1="6" y1="7" x2="22" y2="7" stroke="#44bd32" stroke-width="0.8" opacity="0.25" stroke-linecap="round"/>
        </svg>
        <h1><span>4U2C</span>theUVC</h1>
      </div>
      <div class="header-right">
        <select class="select-control" id="device-select" style="width:auto;min-width:180px" onchange="selectDevice(this.value)">
          <option value="">Detecting cameras...</option>
        </select>
        <span class="status-dot offline" id="status-dot"></span>
        <button class="refresh-btn" onclick="init()">Refresh</button>
      </div>
    </header>

    <div class="preview-section">
      <div class="preview-container">
        <div class="preview-toolbar">
          <span class="toolbar-label">View</span>
          <button class="toolbar-btn" id="btn-false-color" onclick="toggleFalseColor()">False Color</button>
          <button class="toolbar-btn" id="btn-skin-tone" onclick="toggleSkinTone()">Skin Tone</button>
          <span class="toolbar-label" style="margin-left:6px">Preview FPS</span>
          <select class="toolbar-select" id="fps-select" onchange="changePreviewFrameRate(Number(this.value))">
            <option value="0">Auto</option>
            <option value="5">5</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
            <option value="24" selected>24</option>
            <option value="25">25</option>
            <option value="30">30</option>
            <option value="50">50</option>
            <option value="60">60</option>
          </select>
          <span class="fps-actual" id="fps-actual">—</span>
        </div>
        <video id="preview" autoplay playsinline muted></video>
        <div class="preview-message" id="preview-message"></div>
        <canvas id="false-color-overlay"></canvas>
        <canvas id="skin-tone-overlay"></canvas>
        <div class="skin-tone-section" id="skin-tone-controls">
          <div class="skin-tone-header">
            <h2>Skin Tone Qualifier</h2>
            <button class="skin-reset-btn" onclick="resetSkinQualifier()">Reset defaults</button>
          </div>
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">Hue Min (Cb)</span>
              <input class="control-value-input" type="number" id="sqval-cbMin" min="-0.5" max="0.5" step="0.01" value="-0.18"
                onchange="setSkinQualifierValue('cbMin', this, -0.5, 0.5, 0.01)" onkeydown="handleEditableValueKey(event)" aria-label="Hue minimum Cb value">
            </div>
            <input type="range" id="sqslider-cbMin" min="-0.5" max="0.5" step="0.01" value="-0.18"
              oninput="document.getElementById('sqval-cbMin').value=this.value; updateSkinQual('cbMin', this.value)">
          </div>
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">Hue Max (Cb)</span>
              <input class="control-value-input" type="number" id="sqval-cbMax" min="-0.5" max="0.5" step="0.01" value="0.08"
                onchange="setSkinQualifierValue('cbMax', this, -0.5, 0.5, 0.01)" onkeydown="handleEditableValueKey(event)" aria-label="Hue maximum Cb value">
            </div>
            <input type="range" id="sqslider-cbMax" min="-0.5" max="0.5" step="0.01" value="0.08"
              oninput="document.getElementById('sqval-cbMax').value=this.value; updateSkinQual('cbMax', this.value)">
          </div>
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">Hue Min (Cr)</span>
              <input class="control-value-input" type="number" id="sqval-crMin" min="-0.5" max="0.5" step="0.01" value="0.05"
                onchange="setSkinQualifierValue('crMin', this, -0.5, 0.5, 0.01)" onkeydown="handleEditableValueKey(event)" aria-label="Hue minimum Cr value">
            </div>
            <input type="range" id="sqslider-crMin" min="-0.5" max="0.5" step="0.01" value="0.05"
              oninput="document.getElementById('sqval-crMin').value=this.value; updateSkinQual('crMin', this.value)">
          </div>
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">Hue Max (Cr)</span>
              <input class="control-value-input" type="number" id="sqval-crMax" min="-0.5" max="0.5" step="0.01" value="0.42"
                onchange="setSkinQualifierValue('crMax', this, -0.5, 0.5, 0.01)" onkeydown="handleEditableValueKey(event)" aria-label="Hue maximum Cr value">
            </div>
            <input type="range" id="sqslider-crMax" min="-0.5" max="0.5" step="0.01" value="0.42"
              oninput="document.getElementById('sqval-crMax').value=this.value; updateSkinQual('crMax', this.value)">
          </div>
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">Luma Min (IRE)</span>
              <input class="control-value-input" type="number" id="sqval-lumaMin" min="0" max="100" step="1" value="20"
                onchange="setSkinQualifierValue('lumaMin', this, 0, 100, 1)" onkeydown="handleEditableValueKey(event)" aria-label="Luma minimum IRE value">
            </div>
            <input type="range" id="sqslider-lumaMin" min="0" max="100" step="1" value="20"
              oninput="document.getElementById('sqval-lumaMin').value=this.value; updateSkinQual('lumaMin', this.value)">
          </div>
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">Luma Max (IRE)</span>
              <input class="control-value-input" type="number" id="sqval-lumaMax" min="0" max="100" step="1" value="80"
                onchange="setSkinQualifierValue('lumaMax', this, 0, 100, 1)" onkeydown="handleEditableValueKey(event)" aria-label="Luma maximum IRE value">
            </div>
            <input type="range" id="sqslider-lumaMax" min="0" max="100" step="1" value="80"
              oninput="document.getElementById('sqval-lumaMax').value=this.value; updateSkinQual('lumaMax', this.value)">
          </div>
          <div class="control-help">Only qualified pixels are sent to both scopes.</div>
        </div>
        <div class="fc-legend" id="fc-legend"></div>
      </div>
      <div class="scopes-row">
        <div class="scope-panel">
          <span class="scope-label">Vectorscope</span>
          <canvas id="vectorscope" class="scope-canvas"></canvas>
        </div>
        <div class="scope-panel">
          <span class="scope-label">Waveform</span>
          <canvas id="waveform" class="scope-canvas"></canvas>
        </div>
      </div>
    </div>

    <div class="controls-panel" id="controls-panel">
      <div class="loading" id="loading">Loading controls...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <canvas id="sample-canvas" style="display:none"></canvas>

  <script>
    let controlsData = null;
    let controlWriteStates = {};
    let falseColorEnabled = false;
    let skinToneEnabled = false;
    let scopesRunning = false;
    let selectedDevice = null;
    let allDevices = [];
    let previewDeviceKey = null;
    let previewRequestId = 0;
    let fpsMeasurementToken = 0;
    let preferredFrameRate = 24;
    let actualPreviewFrameRate = 0;

    const SAMPLE_W = 320;
    const SAMPLE_H = 180;
    const DECAY = 0.85;

    function toast(msg) {
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      setTimeout(() => el.classList.remove("show"), 2000);
    }

    function devQuery() {
      if (!selectedDevice) return "";
      const params = new URLSearchParams({
        vendor: selectedDevice.vendor,
        product: selectedDevice.product,
        address: selectedDevice.address,
      });
      return `?${params}`;
    }

    function devBody() {
      if (!selectedDevice) return {};
      return {
        vendor: selectedDevice.vendor,
        product: selectedDevice.product,
        address: selectedDevice.address,
      };
    }

    async function api(method, path, body) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body) opts.body = JSON.stringify(body);
      const res = await fetch(`/api${path}`, opts);
      const contentType = res.headers.get("content-type") || "";
      const result = contentType.includes("application/json")
        ? await res.json()
        : { error: await res.text() };
      if (!res.ok) throw new Error(result.error || `Request failed (${res.status})`);
      return result;
    }

    function setControl(control, value) {
      const state = controlWriteStates[control] ||= {
        pendingValue: undefined,
        sending: false,
        timer: null,
      };
      state.pendingValue = value;
      clearTimeout(state.timer);
      state.timer = setTimeout(() => flushControlWrite(control), 80);
    }

    async function flushControlWrite(control) {
      const state = controlWriteStates[control];
      if (!state || state.sending) return;
      state.sending = true;
      try {
        while (state.pendingValue !== undefined) {
          const value = state.pendingValue;
          state.pendingValue = undefined;
          await api("POST", "/set", { control, value, ...devBody() });
        }
      } catch (error) {
        state.pendingValue = undefined;
        toast(`Error: ${error.message}`);
      } finally {
        state.sending = false;
      }
    }

    async function setToggleControl(control, checkbox, onValue, offValue) {
      const requestedValue = checkbox.checked ? onValue : offValue;
      try {
        const result = await api("POST", "/set", {
          control,
          value: requestedValue,
          verify: true,
          ...devBody(),
        });
        checkbox.checked = Number(result.value) === onValue;
      } catch (error) {
        checkbox.checked = !checkbox.checked;
        toast(`Error: ${error.message}`);
      }
    }

    function selectDevice(idx) {
      const i = Number(idx);
      if (i >= 0 && i < allDevices.length) {
        selectedDevice = allDevices[i];
        startPreview(selectedDevice.name);
        loadControls();
      }
    }

    // ── False Color ──
    // Rec.709 IRE-based ranges
    const FALSE_COLOR_STOPS = [
      { max: 5,   r: 128, g: 0,   b: 128, label: "Near black" },
      { max: 15,  r: 0,   g: 0,   b: 180, label: "Deep shadow" },
      { max: 30,  r: 0,   g: 60,  b: 100, label: "Shadow" },
      { max: 42,  r: 0,   g: 140, b: 0,   label: "Lower midtone" },
      { max: 48,  r: 60,  g: 180, b: 60,  label: "Midtone" },
      { max: 55,  r: 100, g: 220, b: 100, label: "Middle gray region" },
      { max: 65,  r: 160, g: 160, b: 160, label: "Upper midtone" },
      { max: 75,  r: 220, g: 180, b: 60,  label: "Bright midtone" },
      { max: 85,  r: 220, g: 120, b: 0,   label: "Highlight" },
      { max: 95,  r: 220, g: 50,  b: 50,  label: "Near clipping" },
      { max: 100, r: 255, g: 0,   b: 0,   label: "Clipping" },
    ];

    // Practical exposure guide, not a normative Rec.709 requirement. Skin luma
    // varies substantially with complexion, lighting, and creative intent.
    const SKIN_IRE_MIN = 40;
    const SKIN_IRE_MAX = 70;

    function falseColorLookup(ire) {
      for (let i = 0; i < FALSE_COLOR_STOPS.length; i++) {
        if (ire <= FALSE_COLOR_STOPS[i].max) return FALSE_COLOR_STOPS[i];
      }
      return FALSE_COLOR_STOPS[FALSE_COLOR_STOPS.length - 1];
    }

    function buildFCLegend() {
      const legend = document.getElementById("fc-legend");
      const bands = FALSE_COLOR_STOPS.map((stop, index) => ({
        ...stop,
        min: index === 0 ? 0 : FALSE_COLOR_STOPS[index - 1].max,
      })).reverse();
      legend.innerHTML = `
        <div class="fc-legend-title">
          FALSE COLOR · REC.709 LUMA
          <span>Typical skin guide: ~${SKIN_IRE_MIN}–${SKIN_IRE_MAX} IRE</span>
        </div>
      ` + bands.map(s => {
        const overlapsSkinGuide = s.max > SKIN_IRE_MIN && s.min < SKIN_IRE_MAX;
        return `
          <div class="fc-legend-stop">
            <div class="fc-legend-color" style="background:rgb(${s.r},${s.g},${s.b})"></div>
            <span class="fc-legend-label">${s.min}–${s.max} IRE · ${s.label}${overlapsSkinGuide ? '<span class="fc-skin-badge">skin</span>' : ''}</span>
          </div>`;
      }).join("");
    }
    buildFCLegend();

    function toggleFalseColor() {
      falseColorEnabled = !falseColorEnabled;
      document.getElementById("btn-false-color").classList.toggle("active", falseColorEnabled);
      document.getElementById("false-color-overlay").style.display = falseColorEnabled ? "block" : "none";
      document.getElementById("fc-legend").classList.toggle("show", falseColorEnabled);
    }

    // ── Skin Tone Indicator ──
    // Rec.709 skin tone qualifier defaults (YCbCr)
    const DEFAULT_SKIN_QUALIFIER = Object.freeze({
      cbMin: -0.18, cbMax: 0.08,
      crMin: 0.05,  crMax: 0.42,
      lumaMin: 20,  lumaMax: 80,
    });
    let skinQual = { ...DEFAULT_SKIN_QUALIFIER };

    function isSkinTone(r, g, b) {
      const cbN = (-0.168736 * r - 0.331264 * g + 0.5 * b) / 128;
      const crN = (0.5 * r - 0.418688 * g - 0.081312 * b) / 128;
      const luma = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255 * 100;
      return cbN >= skinQual.cbMin && cbN <= skinQual.cbMax &&
             crN >= skinQual.crMin && crN <= skinQual.crMax &&
             luma >= skinQual.lumaMin && luma <= skinQual.lumaMax;
    }

    function toggleSkinTone() {
      skinToneEnabled = !skinToneEnabled;
      vsAccum = null;
      wfAccum = null;
      document.getElementById("btn-skin-tone").classList.toggle("active", skinToneEnabled);
      document.getElementById("skin-tone-overlay").style.display = skinToneEnabled ? "block" : "none";
      document.querySelector(".preview-container").classList.toggle("skin-active", skinToneEnabled);
      const section = document.getElementById("skin-tone-controls");
      if (section) section.style.display = skinToneEnabled ? "block" : "none";
    }

    function updateSkinQual(key, val) {
      skinQual[key] = Number(val);
      vsAccum = null;
      wfAccum = null;
      const display = document.getElementById("sqval-" + key);
      if (display) display.value = val;
    }

    function resetSkinQualifier() {
      skinQual = { ...DEFAULT_SKIN_QUALIFIER };
      for (const [key, value] of Object.entries(skinQual)) {
        const input = document.getElementById(`sqval-${key}`);
        const slider = document.getElementById(`sqslider-${key}`);
        if (input) input.value = value;
        if (slider) slider.value = value;
      }
      vsAccum = null;
      wfAccum = null;
      toast("Skin qualifier reset to defaults");
    }

    // ── Vectorscope ──
    function initVectorscope(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      return { ctx, w: rect.width, h: rect.height };
    }

    // 75% color bar Cb/Cr values (BT.601), normalized to -1..+1
    function cbcr(r, g, b) {
      const cb = (-0.168736 * r - 0.331264 * g + 0.5 * b) / 128;
      const cr = (0.5 * r - 0.418688 * g - 0.081312 * b) / 128;
      return { cb, cr };
    }
    const VS_TARGETS = [
      { label: "R",  ...cbcr(191, 0, 0),     color: "#ff4444" },
      { label: "YL", ...cbcr(191, 191, 0),    color: "#ffff00" },
      { label: "G",  ...cbcr(0, 191, 0),      color: "#44ff44" },
      { label: "CY", ...cbcr(0, 191, 191),    color: "#00ffff" },
      { label: "B",  ...cbcr(0, 0, 191),      color: "#4444ff" },
      { label: "MG", ...cbcr(191, 0, 191),    color: "#ff44ff" },
    ];

    // Skin tone direction in Cb/Cr space (typical Caucasian/warm skin)
    const SKIN_CB = cbcr(200, 150, 120).cb;
    const SKIN_CR = cbcr(200, 150, 120).cr;

    function drawVectorscopeBackground(ctx, w, h) {
      const cx = w / 2, cy = h / 2;
      const maxR = Math.min(cx, cy) - 16;

      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);

      // graticule circles
      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 0.5;
      for (let i = 1; i <= 4; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, maxR * (i / 4), 0, Math.PI * 2);
        ctx.stroke();
      }

      // crosshair
      ctx.beginPath();
      ctx.moveTo(cx - maxR, cy); ctx.lineTo(cx + maxR, cy);
      ctx.moveTo(cx, cy - maxR); ctx.lineTo(cx, cy + maxR);
      ctx.stroke();

      // skin tone line — extend from center to edge along the skin Cb/Cr direction
      const skinLen = Math.sqrt(SKIN_CB * SKIN_CB + SKIN_CR * SKIN_CR);
      const skinDx = (SKIN_CB / skinLen) * maxR;
      const skinDy = -(SKIN_CR / skinLen) * maxR;
      ctx.strokeStyle = "rgba(255,180,100,0.35)";
      ctx.lineWidth = 1.5;
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(cx + skinDx, cy + skinDy);
      ctx.stroke();
      ctx.setLineDash([]);

      ctx.fillStyle = "rgba(255,180,100,0.5)";
      ctx.font = "9px -apple-system, sans-serif";
      ctx.fillText("SKIN", cx + skinDx * 1.05, cy + skinDy * 1.05);

      // color targets — positioned by their actual Cb/Cr values
      for (const t of VS_TARGETS) {
        const tx = cx + t.cb * maxR;
        const ty = cy - t.cr * maxR;
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.rect(tx - 5, ty - 5, 10, 10);
        ctx.stroke();
        ctx.fillStyle = t.color;
        ctx.font = "bold 8px -apple-system, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(t.label, tx, ty - 8);
      }
      ctx.textAlign = "start";
    }

    // ── Waveform ──
    function initWaveform(canvas) {
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      const ctx = canvas.getContext("2d");
      ctx.scale(dpr, dpr);
      return { ctx, w: rect.width, h: rect.height };
    }

    function drawWaveformBackground(ctx, w, h) {
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = "rgba(255,255,255,0.08)";
      ctx.lineWidth = 0.5;
      ctx.font = "9px -apple-system, sans-serif";
      ctx.fillStyle = "rgba(255,255,255,0.2)";
      ctx.textAlign = "right";

      const labels = [100, 75, 50, 25, 0];
      const pad = 30;
      const plotH = h - 8;
      for (const ire of labels) {
        const y = 4 + plotH * (1 - ire / 100);
        ctx.beginPath();
        ctx.moveTo(pad, y);
        ctx.lineTo(w, y);
        ctx.stroke();
        ctx.fillText(`${ire}`, pad - 4, y + 3);
      }
      ctx.textAlign = "start";
    }

    // ── Scope engine ──
    let vsAccum = null;
    let wfAccum = null;

    function startScopes() {
      if (scopesRunning) return;
      scopesRunning = true;

      const video = document.getElementById("preview");
      const sampleCanvas = document.getElementById("sample-canvas");
      sampleCanvas.width = SAMPLE_W;
      sampleCanvas.height = SAMPLE_H;
      const sampleCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });

      const vsCanvas = document.getElementById("vectorscope");
      const wfCanvas = document.getElementById("waveform");
      const fcCanvas = document.getElementById("false-color-overlay");

      let vs = initVectorscope(vsCanvas);
      let wf = initWaveform(wfCanvas);

      const vsBackground = document.createElement("canvas");
      vsBackground.width = vsCanvas.width;
      vsBackground.height = vsCanvas.height;
      const vsBgCtx = vsBackground.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      vsBgCtx.scale(dpr, dpr);
      drawVectorscopeBackground(vsBgCtx, vs.w, vs.h);

      const wfBackground = document.createElement("canvas");
      wfBackground.width = wfCanvas.width;
      wfBackground.height = wfCanvas.height;
      const wfBgCtx = wfBackground.getContext("2d");
      wfBgCtx.scale(dpr, dpr);
      drawWaveformBackground(wfBgCtx, wf.w, wf.h);

      let lastFrame = 0;
      const TARGET_FPS = 24;
      const FRAME_INTERVAL = 1000 / TARGET_FPS;

      function processFrame(timestamp) {
        if (!scopesRunning) return;
        requestAnimationFrame(processFrame);

        if (timestamp - lastFrame < FRAME_INTERVAL) return;
        lastFrame = timestamp;

        if (video.readyState < 2) return;

        sampleCtx.drawImage(video, 0, 0, SAMPLE_W, SAMPLE_H);
        const imageData = sampleCtx.getImageData(0, 0, SAMPLE_W, SAMPLE_H);
        const pixels = imageData.data;

        // ── Vectorscope rendering ──
        const vsCx = vs.w / 2, vsCy = vs.h / 2;
        const vsMaxR = Math.min(vsCx, vsCy) - 16;

        if (!vsAccum) {
          vsAccum = new Float32Array(Math.ceil(vs.w) * Math.ceil(vs.h));
        }

        // decay
        for (let i = 0; i < vsAccum.length; i++) {
          vsAccum[i] *= DECAY;
        }

        const vsW = Math.ceil(vs.w);
        const scopeFilter = skinToneEnabled;
        for (let i = 0; i < pixels.length; i += 16) {
          const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
          if (scopeFilter && !isSkinTone(r, g, b)) continue;
          const cb = 128 + (-0.168736 * r - 0.331264 * g + 0.5 * b);
          const cr = 128 + (0.5 * r - 0.418688 * g - 0.081312 * b);
          const nx = (cb - 128) / 128;
          const ny = (cr - 128) / 128;
          const px = Math.round(vsCx + nx * vsMaxR);
          const py = Math.round(vsCy - ny * vsMaxR);
          if (px >= 0 && px < vs.w && py >= 0 && py < vs.h) {
            vsAccum[py * vsW + px] = Math.min(vsAccum[py * vsW + px] + 0.4, 1.0);
          }
        }

        vs.ctx.clearRect(0, 0, vs.w, vs.h);
        vs.ctx.drawImage(vsBackground, 0, 0, vs.w, vs.h);

        const vsImg = vs.ctx.getImageData(0, 0, vsCanvas.width, vsCanvas.height);
        const vsPixels = vsImg.data;
        const dprW = vsCanvas.width;
        for (let y = 0; y < Math.ceil(vs.h); y++) {
          for (let x = 0; x < vsW; x++) {
            const val = vsAccum[y * vsW + x];
            if (val > 0.01) {
              const intensity = Math.min(val, 1.0);
              for (let dy = 0; dy < dpr; dy++) {
                for (let dx = 0; dx < dpr; dx++) {
                  const pi = ((y * dpr + dy) * dprW + (x * dpr + dx)) * 4;
                  const lum = Math.round(80 + 175 * intensity);
                  vsPixels[pi] = Math.max(vsPixels[pi], lum);
                  vsPixels[pi + 1] = Math.max(vsPixels[pi + 1], lum);
                  vsPixels[pi + 2] = Math.max(vsPixels[pi + 2], lum);
                }
              }
            }
          }
        }
        vs.ctx.putImageData(vsImg, 0, 0);

        // ── Waveform rendering ──
        const wfPad = 30;
        const wfPlotW = wf.w - wfPad;
        const wfPlotH = wf.h - 8;
        const wfW = Math.ceil(wf.w);
        const wfH = Math.ceil(wf.h);

        if (!wfAccum) {
          wfAccum = new Float32Array(wfW * wfH);
        }

        for (let i = 0; i < wfAccum.length; i++) {
          wfAccum[i] *= DECAY;
        }

        for (let x = 0; x < SAMPLE_W; x++) {
          const plotX = Math.round(wfPad + (x / SAMPLE_W) * wfPlotW);
          for (let y = 0; y < SAMPLE_H; y++) {
            const pi = (y * SAMPLE_W + x) * 4;
            const r = pixels[pi], g = pixels[pi + 1], b = pixels[pi + 2];
            if (scopeFilter && !isSkinTone(r, g, b)) continue;
            const luma = (0.2126 * r + 0.7152 * g + 0.0722 * b) / 255;
            const plotY = Math.round(4 + wfPlotH * (1 - luma));
            if (plotX >= 0 && plotX < wfW && plotY >= 0 && plotY < wfH) {
              wfAccum[plotY * wfW + plotX] = Math.min(wfAccum[plotY * wfW + plotX] + 0.08, 1.0);
            }
          }
        }

        wf.ctx.clearRect(0, 0, wf.w, wf.h);
        wf.ctx.drawImage(wfBackground, 0, 0, wf.w, wf.h);

        const wfImg = wf.ctx.getImageData(0, 0, wfCanvas.width, wfCanvas.height);
        const wfPixelsData = wfImg.data;
        const wfDprW = wfCanvas.width;
        for (let y = 0; y < wfH; y++) {
          for (let x = 0; x < wfW; x++) {
            const val = wfAccum[y * wfW + x];
            if (val > 0.01) {
              const intensity = Math.min(val, 1.0);
              for (let dy = 0; dy < dpr; dy++) {
                for (let dx = 0; dx < dpr; dx++) {
                  const pi = ((y * dpr + dy) * wfDprW + (x * dpr + dx)) * 4;
                  const lum = Math.round(80 + 175 * intensity);
                  wfPixelsData[pi] = Math.max(wfPixelsData[pi], lum);
                  wfPixelsData[pi + 1] = Math.max(wfPixelsData[pi + 1], lum);
                  wfPixelsData[pi + 2] = Math.max(wfPixelsData[pi + 2], lum);
                }
              }
            }
          }
        }
        wf.ctx.putImageData(wfImg, 0, 0);

        // ── False color overlay ──
        if (falseColorEnabled) {
          fcCanvas.width = SAMPLE_W;
          fcCanvas.height = SAMPLE_H;
          const fcCtx = fcCanvas.getContext("2d");
          const fcImg = fcCtx.createImageData(SAMPLE_W, SAMPLE_H);
          const fcPx = fcImg.data;
          for (let i = 0; i < pixels.length; i += 4) {
            const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
            const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
            const ire = (luma / 255) * 100;
            const c = falseColorLookup(ire);
            fcPx[i] = c.r;
            fcPx[i + 1] = c.g;
            fcPx[i + 2] = c.b;
            fcPx[i + 3] = 200;
          }
          fcCtx.putImageData(fcImg, 0, 0);
        }

        // ── Skin tone overlay ──
        if (skinToneEnabled) {
          const stCanvas = document.getElementById("skin-tone-overlay");
          stCanvas.width = SAMPLE_W;
          stCanvas.height = SAMPLE_H;
          const stCtx = stCanvas.getContext("2d");
          const stImg = stCtx.createImageData(SAMPLE_W, SAMPLE_H);
          const stPx = stImg.data;
          for (let i = 0; i < pixels.length; i += 4) {
            const r = pixels[i], g = pixels[i + 1], b = pixels[i + 2];
            if (isSkinTone(r, g, b)) {
              stPx[i] = pixels[i];
              stPx[i + 1] = pixels[i + 1];
              stPx[i + 2] = pixels[i + 2];
              stPx[i + 3] = 255;
            } else {
              const luma = Math.round(0.2126 * r + 0.7152 * g + 0.0722 * b);
              stPx[i] = luma;
              stPx[i + 1] = luma;
              stPx[i + 2] = luma;
              stPx[i + 3] = 200;
            }
          }
          stCtx.putImageData(stImg, 0, 0);
        }
      }

      requestAnimationFrame(processFrame);

      const resizeObserver = new ResizeObserver(() => {
        vs = initVectorscope(vsCanvas);
        wf = initWaveform(wfCanvas);

        vsBackground.width = vsCanvas.width;
        vsBackground.height = vsCanvas.height;
        const vsBgCtx2 = vsBackground.getContext("2d");
        vsBgCtx2.scale(dpr, dpr);
        drawVectorscopeBackground(vsBgCtx2, vs.w, vs.h);

        wfBackground.width = wfCanvas.width;
        wfBackground.height = wfCanvas.height;
        const wfBgCtx2 = wfBackground.getContext("2d");
        wfBgCtx2.scale(dpr, dpr);
        drawWaveformBackground(wfBgCtx2, wf.w, wf.h);

        vsAccum = null;
        wfAccum = null;
      });
      resizeObserver.observe(vsCanvas);
      resizeObserver.observe(wfCanvas);
    }

    async function startPreview(preferredName = "") {
      const video = document.getElementById("preview");
      const message = document.getElementById("preview-message");
      const deviceKey = preferredName.toLowerCase();
      const previewKey = `${deviceKey}|${preferredFrameRate || "auto"}`;
      if (video.srcObject && previewDeviceKey === previewKey) return;
      const requestId = ++previewRequestId;

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw new Error("Camera preview is not supported by this browser");
        }

        let matchingDevice = null;
        if (deviceKey && navigator.mediaDevices.enumerateDevices) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          matchingDevice = devices.find((device) =>
            device.kind === "videoinput" && device.label.toLowerCase().includes(deviceKey)
          );
        }

        const constraints = {
          // Keep the preview at 1080p or below. Some cameras select a 4K mode
          // when given only an ideal size, which silently caps the frame rate.
          width: { ideal: 1920, max: 1920 },
          height: { ideal: 1080, max: 1080 },
          ...(preferredFrameRate ? {
            // A plain "ideal" is only a hint and Chromium may ignore it. An
            // exact constraint either produces the requested rate or tells us
            // clearly that this resolution/camera combination cannot do it.
            frameRate: { exact: preferredFrameRate },
          } : {}),
          ...(matchingDevice ? { deviceId: { exact: matchingDevice.deviceId } } : {}),
        };
        let stream = await navigator.mediaDevices.getUserMedia({ video: constraints });

        // Device labels are often hidden until the first permission grant. Match
        // the selected UVC camera again once labels become available.
        if (!matchingDevice && deviceKey && navigator.mediaDevices.enumerateDevices) {
          const devices = await navigator.mediaDevices.enumerateDevices();
          matchingDevice = devices.find((device) =>
            device.kind === "videoinput" && device.label.toLowerCase().includes(deviceKey)
          );
          const currentId = stream.getVideoTracks()[0]?.getSettings().deviceId;
          if (matchingDevice && matchingDevice.deviceId !== currentId) {
            stream.getTracks().forEach((track) => track.stop());
            stream = await navigator.mediaDevices.getUserMedia({
              video: { ...constraints, deviceId: { exact: matchingDevice.deviceId } },
            });
          }
        }

        if (requestId !== previewRequestId) {
          stream.getTracks().forEach((track) => track.stop());
          return;
        }

        if (video.srcObject) {
          video.srcObject.getTracks().forEach((track) => track.stop());
        }
        video.srcObject = stream;
        previewDeviceKey = previewKey;
        const previewTrack = stream.getVideoTracks()[0];
        const actualFrameRate = previewTrack?.getSettings().frameRate;
        const trackCapabilities = previewTrack?.getCapabilities?.() || {};
        const trackSettings = previewTrack?.getSettings?.() || {};
        api("POST", "/diagnostic", {
          type: "track-exposure-capabilities",
          details: {
            exposureMode: trackCapabilities.exposureMode,
            exposureTime: trackCapabilities.exposureTime,
            iso: trackCapabilities.iso,
            currentExposureMode: trackSettings.exposureMode,
            currentExposureTime: trackSettings.exposureTime,
            currentIso: trackSettings.iso,
          },
        }).catch(() => {});
        actualPreviewFrameRate = Number(actualFrameRate) || 0;
        const frameRateCapability = trackCapabilities.frameRate;
        const capabilityText = frameRateCapability && Number.isFinite(frameRateCapability.min) && Number.isFinite(frameRateCapability.max)
          ? ` · ${frameRateCapability.min}–${frameRateCapability.max} supported`
          : "";
        document.getElementById("fps-actual").textContent = actualFrameRate
          ? `${Number(actualFrameRate).toFixed(actualFrameRate % 1 ? 1 : 0)} negotiated${capabilityText}`
          : "actual rate unavailable";
        startPreviewFpsMeasurement(video, capabilityText);
        message.style.display = "none";
        message.textContent = "";
        video.addEventListener("playing", () => {
          startScopes();
          if (selectedDevice) loadControls(0);
          setTimeout(() => {
            const startupLuma = measurePreviewLuma();
            if (startupLuma !== null) {
              api("POST", "/diagnostic", {
                type: "preview-startup",
                previewLuma: Number(startupLuma.toFixed(2)),
              }).catch(() => {});
            }
          }, 800);
        }, { once: true });
      } catch (e) {
        console.warn("Preview unavailable:", e);
        if (video.srcObject) {
          const oldRate = video.srcObject.getVideoTracks()[0]?.getSettings().frameRate;
          actualPreviewFrameRate = Number(oldRate) || actualPreviewFrameRate;
          document.getElementById("fps-actual").textContent = preferredFrameRate
            ? `${actualPreviewFrameRate || "?"} actual · ${preferredFrameRate} unavailable`
            : `${actualPreviewFrameRate || "?"} actual · Auto failed`;
          message.style.display = "none";
          toast(preferredFrameRate
            ? `${preferredFrameRate} FPS is not available in the current camera mode`
            : `Could not renegotiate automatic frame rate: ${e.message}`);
          return;
        }
        message.textContent = `Preview unavailable: ${e.message}`;
        message.style.display = "grid";
      }
    }

    function startPreviewFpsMeasurement(video, capabilityText = "") {
      const token = ++fpsMeasurementToken;
      if (!video.requestVideoFrameCallback) return;
      let frames = 0;
      let sampleStarted = performance.now();

      const sampleFrameRate = (now) => {
        if (token !== fpsMeasurementToken || !video.srcObject) return;
        frames += 1;
        const elapsed = now - sampleStarted;
        if (elapsed >= 1500) {
          const measured = frames * 1000 / elapsed;
          document.getElementById("fps-actual").textContent =
            `${measured.toFixed(1)} measured${capabilityText}`;
          frames = 0;
          sampleStarted = now;
        }
        video.requestVideoFrameCallback(sampleFrameRate);
      };
      video.requestVideoFrameCallback(sampleFrameRate);
    }

    function changePreviewFrameRate(frameRate) {
      preferredFrameRate = frameRate;
      previewDeviceKey = null;
      document.getElementById("fps-actual").textContent = "…";
      startPreview(selectedDevice?.name || "");
    }

    function clampNumber(value, min, max) {
      return Math.min(max, Math.max(min, Number(value)));
    }

    function commitNumericControl(control, input, min, max) {
      const value = Math.round(clampNumber(input.value, min, max));
      input.value = value;
      const slider = document.getElementById(`slider-${control}`);
      if (slider) slider.value = value;
      setControl(control, value);
    }

    function handleEditableValueKey(event) {
      if (event.key === "Enter") event.currentTarget.blur();
    }

    function setPanTiltValue(axis, input, min, max) {
      const value = Math.round(clampNumber(input.value, min, max));
      input.value = value;
      document.getElementById(`slider-${axis}`).value = value;
      const pan = Number(document.getElementById("slider-pan").value);
      const tilt = Number(document.getElementById("slider-tilt").value);
      setControl("absolute_pan_tilt", [pan, tilt]);
    }

    function setSkinQualifierValue(key, input, min, max, step) {
      const value = clampNumber(input.value, min, max);
      const decimals = String(step).includes(".") ? String(step).split(".")[1].length : 0;
      input.value = value.toFixed(decimals);
      document.getElementById(`sqslider-${key}`).value = value;
      updateSkinQual(key, value);
    }

    let exposureWriteId = 0;

    // The Kiyo reports a continuous UVC range, but its image processor only
    // applies a small shutter table. Values between these entries are accepted
    // and read back while producing the same image as the camera's default.
    const KIYO_EXPOSURE_STOPS = Object.freeze([
      { value: 5, label: "1/2000 s" },
      { value: 10, label: "1/1000 s" },
      { value: 20, label: "1/500 s" },
      { value: 39, label: "1/256 s" },
      { value: 78, label: "1/128 s" },
      { value: 156, label: "1/64 s" },
      { value: 312, label: "1/32 s" },
      { value: 625, label: "1/16 s" },
      { value: 1250, label: "1/8 s" },
      { value: 2047, label: "~1/5 s (maximum)" },
    ]);

    function isKiyoProUltra() {
      return Number(selectedDevice?.vendor) === 0x1532 &&
        Number(selectedDevice?.product) === 0x0e08;
    }

    function nearestKiyoExposureStop(value) {
      let bestIndex = 0;
      let bestDistance = Infinity;
      KIYO_EXPOSURE_STOPS.forEach((stop, index) => {
        const distance = Math.abs(stop.value - Number(value));
        if (distance < bestDistance) {
          bestIndex = index;
          bestDistance = distance;
        }
      });
      return bestIndex;
    }

    function previewKiyoExposure(index) {
      const stop = KIYO_EXPOSURE_STOPS[Math.round(Number(index))];
      if (!stop) return;
      document.getElementById("val-absolute_exposure_time").textContent = stop.value;
      document.getElementById("exposure-shutter-label").textContent = stop.label;
    }

    function measurePreviewLuma() {
      const video = document.getElementById("preview");
      if (!video || video.readyState < 2 || !video.videoWidth || !video.videoHeight) return null;
      const canvas = document.createElement("canvas");
      canvas.width = 160;
      canvas.height = 90;
      const ctx = canvas.getContext("2d", { willReadFrequently: true });
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const pixels = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let total = 0;
      for (let i = 0; i < pixels.length; i += 4) {
        total += 0.2126 * pixels[i] + 0.7152 * pixels[i + 1] + 0.0722 * pixels[i + 2];
      }
      return total / (pixels.length / 4) / 255 * 100;
    }

    async function commitNativeExposure(rawValue) {
      const value = Math.round(Number(rawValue));
      const autoExposureToggle = document.getElementById("toggle-auto_exposure_mode");
      if (autoExposureToggle) autoExposureToggle.checked = false;
      const writeId = ++exposureWriteId;
      const status = document.getElementById("exposure-diagnostic");
      if (status) status.textContent = `Writing ${value}…`;
      try {
        const result = await api("POST", "/set", {
          control: "absolute_exposure_time",
          value,
          verify: true,
          ...devBody(),
        });
        if (writeId !== exposureWriteId) return;
        const acceptedValue = Math.round(Number(result.value));
        const slider = document.getElementById("slider-absolute_exposure_time");
        const display = document.getElementById("val-absolute_exposure_time");
        if (slider?.dataset.kiyoStops === "true") {
          const acceptedIndex = nearestKiyoExposureStop(acceptedValue);
          slider.value = acceptedIndex;
          previewKiyoExposure(acceptedIndex);
        } else if (slider) {
          slider.value = acceptedValue;
        }
        if (display) display.textContent = acceptedValue;
        if (acceptedValue !== value) {
          toast(`Camera accepted exposure ${acceptedValue}, not ${value}`);
        }
        await new Promise((resolve) => setTimeout(resolve, 500));
        if (writeId !== exposureWriteId) return;
        const luma = measurePreviewLuma();
        const diagnostic = result.diagnostic;
        if (status && diagnostic) {
          const mode = diagnostic.modeAfter === 1 ? "manual" : `mode ${diagnostic.modeAfter}`;
          status.textContent = `Requested ${value} · immediate ${diagnostic.immediate} · after 300 ms ${diagnostic.settled} · ${mode}` +
            (luma === null ? "" : ` · preview luma ${luma.toFixed(1)}%`);
          if (luma !== null) {
            api("POST", "/diagnostic", {
              type: "exposure-preview",
              requested: value,
              cameraValue: diagnostic.settled,
              previewLuma: Number(luma.toFixed(2)),
            }).catch(() => {});
          }
        }
      } catch (error) {
        if (writeId === exposureWriteId) {
          if (status) status.textContent = `Exposure error: ${error.message}`;
          toast(`Exposure error: ${error.message}`);
        }
      }
    }

    function exposureSliderHTML(range, currentValue) {
      if (isKiyoProUltra()) {
        const currentIndex = nearestKiyoExposureStop(currentValue);
        const currentStop = KIYO_EXPOSURE_STOPS[currentIndex];
        return `
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">Exposure Time</span>
              <span><span class="control-value" id="val-absolute_exposure_time">${currentStop.value}</span><span class="control-help" id="exposure-shutter-label" style="display:inline;margin-left:7px">${currentStop.label}</span></span>
            </div>
            <div class="exposure-slider-wrap">
              <input type="range" id="slider-absolute_exposure_time" min="0"
                max="${KIYO_EXPOSURE_STOPS.length - 1}" step="1" value="${currentIndex}"
                data-kiyo-stops="true"
                oninput="previewKiyoExposure(this.value)"
                onchange="commitNativeExposure(KIYO_EXPOSURE_STOPS[Math.round(Number(this.value))].value)">
            </div>
            <div class="control-help">Verified Kiyo shutter stops · displayed number is the native UVC value</div>
            <div class="control-help" id="exposure-diagnostic">Release the slider to write and verify an exposure value.</div>
          </div>`;
      }
      return `
        <div class="control-row">
          <div class="control-header">
            <span class="control-label">Exposure Time</span>
            <span class="control-value" id="val-absolute_exposure_time">${currentValue}</span>
          </div>
          <div class="exposure-slider-wrap">
            <input type="range" id="slider-absolute_exposure_time" min="${range.min}"
              max="${range.max}" step="${range.resolution || 1}" value="${currentValue}"
              oninput="document.getElementById('val-absolute_exposure_time').textContent=this.value"
              onchange="commitNativeExposure(this.value)">
          </div>
          <div class="control-help">Native UVC units (${range.min}–${range.max})</div>
          <div class="control-help" id="exposure-diagnostic">Release the slider to write and verify an exposure value.</div>
        </div>`;
    }

    function renderControls(data) {
      const { controls, ranges, values } = data;
      if (!ranges || typeof ranges !== "object" || !values || typeof values !== "object") {
        throw new Error("Camera returned incomplete control data");
      }
      controlsData = data;
      const panel = document.getElementById("controls-panel");

      const toggleControls = [
        { key: "auto_exposure_mode", label: "Auto Exposure", isAuto: (v) => v === 8, onVal: 8, offVal: 1 },
        { key: "auto_exposure_priority", label: "Exposure Priority", isAuto: (v) => v === 1, onVal: 1, offVal: 0 },
        { key: "auto_focus", label: "Auto Focus", isAuto: (v) => v === 1, onVal: 1, offVal: 0 },
        { key: "auto_white_balance_temperature", label: "Auto White Balance", isAuto: (v) => v === 1, onVal: 1, offVal: 0 },
      ];

      const exposureSliders = [
        { key: "absolute_exposure_time", label: "Exposure Time" },
        { key: "gain", label: "Gain (ISO)" },
      ];

      const imageSliders = [
        { key: "brightness", label: "Brightness" },
        { key: "contrast", label: "Contrast" },
        { key: "saturation", label: "Saturation" },
        { key: "sharpness", label: "Sharpness" },
        { key: "white_balance_temperature", label: "White Balance (K)" },
      ];

      const lensSliders = [
        { key: "absolute_focus", label: "Focus Distance" },
        { key: "absolute_zoom", label: "Zoom" },
      ];

      function sliderHTML(s) {
        const range = ranges[s.key];
        if (!range) return "";
        const val = values[s.key] ?? range.min;
        if (s.key === "absolute_exposure_time") {
          return exposureSliderHTML(range, val);
        }
        return `
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">${s.label}</span>
              <input class="control-value-input" type="number" id="val-${s.key}"
                min="${range.min}" max="${range.max}" step="1" value="${val}"
                onchange="commitNumericControl('${s.key}', this, ${range.min}, ${range.max})"
                onkeydown="handleEditableValueKey(event)" aria-label="${s.label} value">
            </div>
            <input type="range" id="slider-${s.key}" min="${range.min}" max="${range.max}" value="${val}"
              oninput="document.getElementById('val-${s.key}').value=this.value; setControl('${s.key}', Number(this.value))">
          </div>`;
      }

      function toggleHTML(t) {
        const val = values[t.key];
        const checked = t.isAuto(val) ? "checked" : "";
        return `
          <div class="toggle-row">
            <span class="toggle-label">${t.label}</span>
            <label class="toggle">
              <input type="checkbox" id="toggle-${t.key}" ${checked}
                onchange="setToggleControl('${t.key}', this, ${t.onVal}, ${t.offVal})">
              <span class="toggle-track"></span>
              <span class="toggle-knob"></span>
            </label>
          </div>`;
      }

      const panVal = values.absolute_pan_tilt || [0, 0];
      const panRange = ranges.absolute_pan_tilt || { min: [-36000, -36000], max: [36000, 36000] };

      const powerLineVal = values.power_line_frequency ?? 2;
      const backlightVal = values.backlight_compensation ?? 0;

      panel.innerHTML = `
        <div class="panel-section">
          <h2>Auto Modes</h2>
          ${toggleControls.map(toggleHTML).join("")}
        </div>

        <div class="panel-section">
          <h2>Exposure</h2>
          ${exposureSliders.map(sliderHTML).join("")}
        </div>

        <div class="panel-section">
          <h2>Image</h2>
          ${imageSliders.map(sliderHTML).join("")}
        </div>

        <div class="panel-section">
          <h2>Lens</h2>
          ${lensSliders.map(sliderHTML).join("")}
          <div class="pan-tilt-grid">
            <div class="control-row">
              <div class="control-header">
                <span class="control-label">Pan</span>
                <input class="control-value-input" type="number" id="val-pan" min="${panRange.min[0]}" max="${panRange.max[0]}" step="1" value="${panVal[0]}"
                  onchange="setPanTiltValue('pan', this, ${panRange.min[0]}, ${panRange.max[0]})" onkeydown="handleEditableValueKey(event)" aria-label="Pan value">
              </div>
              <input type="range" id="slider-pan" min="${panRange.min[0]}" max="${panRange.max[0]}" value="${panVal[0]}"
                oninput="document.getElementById('val-pan').value=this.value; setControl('absolute_pan_tilt', [Number(this.value), Number(document.getElementById('slider-tilt').value)])">
            </div>
            <div class="control-row">
              <div class="control-header">
                <span class="control-label">Tilt</span>
                <input class="control-value-input" type="number" id="val-tilt" min="${panRange.min[1]}" max="${panRange.max[1]}" step="1" value="${panVal[1]}"
                  onchange="setPanTiltValue('tilt', this, ${panRange.min[1]}, ${panRange.max[1]})" onkeydown="handleEditableValueKey(event)" aria-label="Tilt value">
              </div>
              <input type="range" id="slider-tilt" min="${panRange.min[1]}" max="${panRange.max[1]}" value="${panVal[1]}"
                oninput="document.getElementById('val-tilt').value=this.value; setControl('absolute_pan_tilt', [Number(document.getElementById('slider-pan').value), Number(this.value)])">
            </div>
          </div>
        </div>

        <div class="panel-section">
          <h2>Other</h2>
          <div class="toggle-row">
            <span class="toggle-label">Backlight Compensation</span>
            <label class="toggle">
              <input type="checkbox" id="toggle-backlight_compensation" ${backlightVal ? "checked" : ""}
                onchange="setToggleControl('backlight_compensation', this, 1, 0)">
              <span class="toggle-track"></span>
              <span class="toggle-knob"></span>
            </label>
          </div>
          <div class="control-help" style="margin-bottom:14px">Effect is camera- and scene-dependent; the switch reflects the value confirmed by the Kiyo.</div>
          <div class="control-row">
            <div class="control-header">
              <span class="control-label">Power Line Frequency</span>
            </div>
            <select class="select-control" onchange="setControl('power_line_frequency', Number(this.value))">
              <option value="0" ${powerLineVal === 0 ? "selected" : ""}>Disabled</option>
              <option value="1" ${powerLineVal === 1 ? "selected" : ""}>50 Hz</option>
              <option value="2" ${powerLineVal === 2 ? "selected" : ""}>60 Hz</option>
            </select>
          </div>
        </div>

        <div class="preset-section">
          <h2>Presets</h2>
          <div class="preset-actions">
            <input type="text" id="preset-name" placeholder="Preset name...">
            <button class="btn btn-primary" onclick="savePreset()">Save</button>
          </div>
          <div class="preset-list" id="preset-list"></div>
        </div>
      `;

      loadPresets();
    }

    async function loadPresets() {
      const presets = await api("GET", "/presets");
      const list = document.getElementById("preset-list");
      if (!presets.length) {
        list.innerHTML = '<div style="font-size:12px;color:var(--text-dim);padding:8px 0">No presets saved yet</div>';
        return;
      }
      list.innerHTML = presets.map(p => `
        <div class="preset-item">
          <div>
            <div class="preset-item-name">${p.name}</div>
            <div class="preset-item-date">${new Date(p.savedAt).toLocaleDateString()}</div>
          </div>
          <div class="preset-item-actions">
            <button class="btn btn-secondary" onclick="loadPreset('${p.name}')">Load</button>
            <button class="btn btn-danger" onclick="deletePreset('${p.name}')">Delete</button>
          </div>
        </div>
      `).join("");
    }

    async function savePreset() {
      const input = document.getElementById("preset-name");
      const name = input.value.trim();
      if (!name) return toast("Enter a preset name");
      await api("POST", "/presets/save", { name, ...devBody() });
      input.value = "";
      toast(`Preset "${name}" saved`);
      loadPresets();
    }

    async function loadPreset(name) {
      const result = await api("POST", "/presets/load", { name, ...devBody() });
      if (result.ok) {
        toast(`Loaded preset "${name}"`);
        loadControls();
      } else {
        toast(`Error: ${result.error}`);
      }
    }

    async function deletePreset(name) {
      await api("DELETE", `/presets/${name}`);
      toast(`Deleted "${name}"`);
      loadPresets();
    }

    async function loadControls(retries = 2) {
      if (!selectedDevice) return;
      const dot = document.getElementById("status-dot");
      try {
        const data = await api("GET", `/controls${devQuery()}`);
        renderControls(data);
        dot.classList.remove("offline");
      } catch (e) {
        if (retries > 0) {
          setTimeout(() => loadControls(retries - 1), 2000);
          return;
        }
        dot.classList.add("offline");
        document.getElementById("controls-panel").innerHTML =
          '<div class="loading">Could not load controls — click Refresh to retry</div>';
      }
    }

    async function init(retries = 6) {
      const dot = document.getElementById("status-dot");
      const select = document.getElementById("device-select");
      try {
        const devices = await api("GET", "/devices");
        if (!Array.isArray(devices)) throw new Error("Invalid camera list from server");
        allDevices = devices;
        if (devices.length) {
          select.innerHTML = devices.map((d, i) =>
            `<option value="${i}">${d.name}</option>`
          ).join("");
          selectedDevice = devices[0];
          dot.classList.remove("offline");
          startPreview(selectedDevice.name);
          loadControls();
        } else if (retries > 0) {
          select.innerHTML = '<option value="">Scanning for cameras...</option>';
          setTimeout(() => init(retries - 1), 2000);
          return;
        } else {
          select.innerHTML = '<option value="">No cameras found</option>';
          dot.classList.add("offline");
          document.getElementById("controls-panel").innerHTML =
            '<div class="loading">No cameras detected — connect a camera and click Refresh</div>';
        }
      } catch (e) {
        if (retries > 0) {
          setTimeout(() => init(retries - 1), 2000);
          return;
        }
        dot.classList.add("offline");
        select.innerHTML = '<option value="">No cameras found</option>';
        document.getElementById("controls-panel").innerHTML =
          '<div class="loading">Could not connect to server</div>';
      }
    }

    startPreview();
    init();
  </script>
</body>
</html>
